<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC Animals | เรียนรู้ตัวอักษรภาษาอังกฤษ</title>
  <meta name="description" content="เรียนรู้ตัวอักษร A-Z ผ่านภาพสัตว์น่ารัก พร้อมเสียงออกเสียงจริง สำหรับเด็กอายุ 2-5 ปี">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+Thai:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <a href="../../index.html" class="back-btn" title="กลับหน้าหลัก">🏠</a>
          <span class="logo-icon">🔤</span>
          <div>
            <h1>ABC Animals</h1>
            <p class="tagline">เรียนรู้ตัวอักษร A ถึง Z</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="progress-wrap">
            <span class="progress-emoji" id="progress-emoji">⭐</span>
            <span class="progress-text"><span id="learned-count">0</span> / 26</span>
          </div>
          <button class="action-btn" id="btn-sound-toggle" title="เปิด/ปิดเสียง">🔊</button>
          <button class="action-btn reset-btn" id="btn-reset" title="เริ่มใหม่">🔄 เริ่มใหม่</button>
        </div>
      </div>
    </header>

    <!-- Alphabet Grid -->
    <main class="game-main">
      <div class="alphabet-grid" id="alphabet-grid"></div>
    </main>

  </div>

  <!-- Letter Detail Modal -->
  <div class="modal-overlay" id="letter-modal">
    <div class="modal-card" id="modal-card">
      <button class="modal-close" id="modal-close">×</button>

      <!-- Nav arrows -->
      <button class="nav-arrow left"  id="btn-prev">‹</button>
      <button class="nav-arrow right" id="btn-next">›</button>

      <div class="modal-letter-top">
        <span class="modal-big-letter" id="modal-big-letter">A</span>
        <span class="modal-small-letter" id="modal-small-letter">a</span>
      </div>

      <div class="modal-animal-display" id="modal-animal-display">
        <!-- emoji or img injected by JS -->
      </div>

      <div class="modal-word-row">
        <span class="modal-word" id="modal-word">Ant</span>
      </div>

      <div class="modal-phonics" id="modal-phonics">"แอ-น-ท์"</div>

      <button class="speak-btn" id="btn-speak">
        <span class="speak-icon">🔊</span>
        <span>ฟังเสียง</span>
      </button>

      <!-- Stars earned -->
      <div class="modal-star" id="modal-star">⭐ เรียนรู้แล้ว!</div>
    </div>
  </div>

  <!-- All Done Victory -->
  <div class="modal-overlay" id="victory-modal">
    <div class="victory-card">
      <div class="victory-ribbon">🎉 ยอดเยี่ยมมาก! 🎉</div>
      <div class="victory-big">🏆</div>
      <h2>เรียนครบ A-Z แล้ว!</h2>
      <p>เก่งมากๆ รู้จักตัวอักษรทุกตัวแล้ว!</p>
      <button class="victory-btn" id="btn-play-again">เล่นอีกรอบ 🔄</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
