<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมระบายสีเวทมนตร์ | Magic Coloring</title>
  <meta name="description" content="ลากนิ้วแล้วภาพสัตว์น่ารักจะค่อยๆ ปรากฏขึ้นมาเหมือนเวทมนตร์!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+Thai:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <a href="../../index.html" class="back-btn" title="กลับหน้าหลัก">🏠</a>
          <span class="logo-icon">🎨</span>
          <h1>ระบายสีเวทมนตร์</h1>
        </div>
        <div class="header-actions">
          <div class="progress-wrap">
            <span class="progress-label">เปิดเผยแล้ว</span>
            <div class="progress-bar-outer">
              <div class="progress-bar-inner" id="progress-bar"></div>
            </div>
            <span class="progress-pct" id="progress-pct">0%</span>
          </div>
          <button class="action-btn" id="btn-sound-toggle" title="เปิด/ปิดเสียง">🔊</button>
          <button class="action-btn" id="btn-new-animal" title="เปลี่ยนภาพ">🔀 เปลี่ยน</button>
        </div>
      </div>
    </header>

    <main class="game-main">
      <!-- Animal Selector -->
      <div class="animal-selector" id="animal-selector">
        <button class="animal-pill active" data-animal="panda" id="pick-panda">
          <img src="../../assets/cute_panda.png" alt="แพนด้า"><span>แพนด้า</span>
        </button>
        <button class="animal-pill" data-animal="lion" id="pick-lion">
          <img src="../../assets/cute_lion.png" alt="สิงโต"><span>สิงโต</span>
        </button>
        <button class="animal-pill" data-animal="elephant" id="pick-elephant">
          <img src="../../assets/cute_elephant.png" alt="ช้างน้อย"><span>ช้างน้อย</span>
        </button>
        <button class="animal-pill" data-animal="fox" id="pick-fox">
          <img src="../../assets/cute_fox.png" alt="จิ้งจอก"><span>จิ้งจอก</span>
        </button>
        <button class="animal-pill" data-animal="cat" id="pick-cat">
          <img src="../../assets/cute_cat.png" alt="แมวเหมียว"><span>แมวเหมียว</span>
        </button>
        <button class="animal-pill" data-animal="koala" id="pick-koala">
          <img src="../../assets/cute_koala.png" alt="โคอาล่า"><span>โคอาล่า</span>
        </button>
        <button class="animal-pill" data-animal="rabbit" id="pick-rabbit">
          <img src="../../assets/cute_rabbit.png" alt="กระต่าย"><span>กระต่าย</span>
        </button>
        <button class="animal-pill" data-animal="monkey" id="pick-monkey">
          <img src="../../assets/cute_monkey.png" alt="ลิงซน"><span>ลิงซน</span>
        </button>
      </div>

      <!-- Canvas Area -->
      <div class="canvas-area" id="canvas-area">
        <div class="canvas-card" id="canvas-card">
          <!-- Brush size selector -->
          <div class="brush-bar">
            <span class="brush-label">🖌️ ขนาดแปรง</span>
            <button class="brush-btn active" data-size="40"  id="brush-sm">S</button>
            <button class="brush-btn"        data-size="70"  id="brush-md">M</button>
            <button class="brush-btn"        data-size="110" id="brush-lg">L</button>
            <button class="brush-btn"        data-size="160" id="brush-xl">XL</button>
          </div>

          <div class="canvas-wrapper" id="canvas-wrapper">
            <canvas id="coloring-canvas"></canvas>
            <!-- Loading overlay -->
            <div class="loading-overlay" id="loading-overlay">
              <div class="spinner"></div>
              <span>กำลังโหลดรูป...</span>
            </div>
            <!-- Hint text when not started -->
            <div class="hint-overlay" id="hint-overlay">
              <div class="hint-content">
                <span class="hint-emoji">✨</span>
                <p>ลากนิ้วหรือเมาส์บนรูป<br>เพื่อเปิดเผยภาพสัตว์น่ารัก!</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Victory Modal -->
  <div class="modal-overlay" id="victory-modal">
    <div class="modal-content victory-card">
      <div class="victory-ribbon">🌈 เปิดภาพสำเร็จ! 🌈</div>
      <div class="victory-animal-preview" id="victory-preview"></div>
      <h2>ยอดเยี่ยมมากๆ!</h2>
      <p class="victory-sub">คุณเปิดเผยภาพสัตว์ได้ครบแล้ว 🎉</p>
      <div class="victory-btns">
        <button class="victory-btn primary" id="btn-next-animal">ภาพต่อไป ➡️</button>
        <button class="victory-btn secondary" id="btn-play-again">ลองใหม่ 🔄</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
