<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกมจับคู่ภาพสัตว์ | Animal Memory Match</title>
  <meta name="description" content="เกมจับคู่ภาพสัตว์น่ารัก ฝึกความจำสำหรับเด็กเล็กอายุ 3+ ปี">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+Thai:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <a href="../../index.html" class="back-btn" title="กลับหน้าหลัก">🏠</a>
          <span class="logo-icon">🃏</span>
          <h1>จับคู่ภาพสัตว์</h1>
        </div>
        <div class="header-actions">
          <div class="score-display">
            <span class="score-label">คู่ที่ได้</span>
            <span class="score-value" id="score-display">0</span>
          </div>
          <div class="score-display">
            <span class="score-label">ครั้งที่พลิก</span>
            <span class="score-value" id="moves-display">0</span>
          </div>
          <button class="action-btn" id="btn-sound-toggle" title="เปิด/ปิดเสียง">🔊</button>
          <button class="action-btn" id="btn-new-game" title="เริ่มเกมใหม่">🔄 ใหม่</button>
        </div>
      </div>
    </header>

    <main class="game-main">
      <!-- Difficulty selector -->
      <div class="diff-bar">
        <button class="diff-pill active" data-mode="easy" id="mode-easy">🌟 ง่าย (4 คู่)</button>
        <button class="diff-pill" data-mode="medium" id="mode-medium">🔥 ปานกลาง (6 คู่)</button>
        <button class="diff-pill" data-mode="hard" id="mode-hard">💪 ท้าทาย (8 คู่)</button>
      </div>

      <!-- Card Grid -->
      <div class="card-grid-container">
        <div class="card-grid" id="card-grid"></div>
      </div>
    </main>
  </div>

  <!-- Victory Modal -->
  <div class="modal-overlay" id="victory-modal">
    <div class="modal-content victory-card">
      <div class="victory-ribbon">🎉 เก่งมากเลย! 🎉</div>
      <div class="victory-emoji" id="victory-emoji">🏆</div>
      <h2>จับคู่สำเร็จทั้งหมด!</h2>
      <p class="victory-sub" id="victory-stats">เยี่ยมมาก!</p>
      <button class="play-again-btn" id="btn-play-again">เล่นอีกรอบ 🔄</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
