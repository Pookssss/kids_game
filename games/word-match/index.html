<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จับคู่สัตว์ภาษาอังกฤษ | Animal Word Match</title>
  <meta name="description" content="จับคู่รูปภาพสัตว์กับคำภาษาอังกฤษ เรียนรู้คำศัพท์สัตว์สำหรับเด็กอายุ 2-5 ปี">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Noto+Sans+Thai:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <a href="../../index.html" class="back-btn">🏠</a>
          <span class="logo-icon">🔗</span>
          <div>
            <h1>จับคู่สัตว์</h1>
            <p class="tagline">Match the animal with its name!</p>
          </div>
        </div>
        <div class="header-actions">
          <div class="score-pill" id="score-pill">
            <span class="score-icon">⭐</span>
            <span id="score-val">0</span>
            <span class="score-sep">/</span>
            <span id="score-total">0</span>
          </div>
          <div class="diff-bar">
            <button class="diff-pill active" data-pairs="3" id="diff-easy">🌟 ง่าย</button>
            <button class="diff-pill"        data-pairs="5" id="diff-med">🔥 กลาง</button>
            <button class="diff-pill"        data-pairs="8" id="diff-hard">💪 ยาก</button>
          </div>
          <button class="action-btn" id="btn-sound">🔊</button>
          <button class="action-btn" id="btn-new">🔄 ใหม่</button>
        </div>
      </div>
    </header>

    <!-- Game Area -->
    <main class="game-main" id="game-main">

      <!-- Instruction strip -->
      <div class="instruction" id="instruction">
        <span class="instr-icon">👆</span>
        <span id="instr-text">กดรูปภาพสัตว์ แล้วกดคำภาษาอังกฤษที่ตรงกัน!</span>
      </div>

      <!-- Top: Image Cards -->
      <section class="cards-section">
        <p class="section-label">🖼️ รูปภาพสัตว์</p>
        <div class="image-grid" id="image-grid"></div>
      </section>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-icon">🔗</span>
        <div class="divider-line"></div>
      </div>

      <!-- Bottom: Word Cards -->
      <section class="cards-section">
        <p class="section-label">🔤 คำภาษาอังกฤษ</p>
        <div class="word-grid" id="word-grid"></div>
      </section>

    </main>
  </div>

  <!-- Celebration overlay (brief flash) -->
  <div class="celebrate-overlay" id="celebrate-overlay">
    <div class="celebrate-emoji" id="celebrate-emoji">🎉</div>
  </div>

  <!-- Victory Modal -->
  <div class="modal-overlay" id="victory-modal">
    <div class="victory-card">
      <div class="victory-ribbon">🏆 ยอดเยี่ยม! 🏆</div>
      <div class="victory-big" id="victory-emoji-main">🌟</div>
      <h2>จับคู่ได้ครบแล้ว!</h2>
      <p id="victory-msg">เก่งมากๆ เลย!</p>
      <div class="victory-btns">
        <button class="v-btn primary" id="btn-next-round">ต่อไป ▶</button>
        <button class="v-btn secondary" id="btn-replay">เล่นอีกครั้ง 🔄</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
